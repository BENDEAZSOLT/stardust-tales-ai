name: iOS Wrapper Simulator Build

# Validates that the Capacitor iOS wrapper in ios-wrapper/ builds for the
# iOS Simulator. No code signing is performed and none is required for a
# simulator build. This does NOT produce an App Store artifact — signing
# and upload are a separate, later phase.

on:
  push:
    branches:
      - feat/ios-capacitor-wrapper
    paths:
      - 'ios-wrapper/**'
      - '.github/workflows/ios-wrapper-build.yml'
  pull_request:
    paths:
      - 'ios-wrapper/**'
      - '.github/workflows/ios-wrapper-build.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  simulator-build:
    name: Build for iOS Simulator (unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Versions (diagnostic)
        run: |
          node --version
          npm --version
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphonesimulator || true

      - name: Install npm dependencies
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee /tmp/build.log

      - name: Capacitor sync (ios)
        run: |
          set -o pipefail
          set -x
          npx cap sync ios 2>&1 | tee -a /tmp/build.log

      - name: Install CocoaPods dependencies (if a Podfile is present)
        run: |
          set -o pipefail
          {
            if [ -f ios/App/Podfile ]; then
              cd ios/App
              gem list cocoapods -i >/dev/null 2>&1 || gem install cocoapods --no-document
              pod install --repo-update
            else
              echo "No Podfile found — this Capacitor project uses Swift Package Manager for the native runtime, so CocoaPods is not needed."
            fi
          } 2>&1 | tee -a /tmp/build.log

      - name: Resolve Swift Package dependencies
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App 2>&1 | tee -a /tmp/build.log

      - name: Select build target (workspace if CocoaPods generated one, otherwise the xcodeproj)
        id: target
        run: |
          if [ -f ios/App/App.xcworkspace/contents.xcworkspacedata ]; then
            echo "flag=-workspace" >> "$GITHUB_OUTPUT"
            echo "path=ios/App/App.xcworkspace" >> "$GITHUB_OUTPUT"
          else
            echo "flag=-project" >> "$GITHUB_OUTPUT"
            echo "path=ios/App/App.xcodeproj" >> "$GITHUB_OUTPUT"
          fi

      - name: List available iOS Simulators (diagnostic)
        run: xcrun simctl list devicetypes | grep -i iphone || true

      - name: Build for iOS Simulator (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            ${{ steps.target.outputs.flag }} "${{ steps.target.outputs.path }}" \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee -a /tmp/build.log

      - name: Post failure diagnostics as a commit comment
        if: failure()
        run: |
          LOG_TAIL=$(tail -c 55000 /tmp/build.log 2>/dev/null || echo "no log captured")
          BODY=$(python3 - "$LOG_TAIL" <<'PYEOF'
          import json, sys
          text = sys.argv[1]
          body = "### iOS wrapper CI failure diagnostics (auto-posted)\n\n```\n" + text + "\n```"
          print(json.dumps({"body": body}))
          PYEOF
          )
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "$BODY"
