name: Secret Guard

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reject tracked credential artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(.env .env.local .env.production service-account.json credentials.json key.properties secrets.json youtube_client_secret.json youtube_token.json youtube_brand_token.json)
          for file in "${forbidden[@]}"; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              echo "Forbidden credential file is tracked: $file" >&2
              exit 1
            fi
          done
          if git ls-files | grep -Ei '\.(jks|keystore|p12|p8)$' >/tmp/secret-files.txt; then
            cat /tmp/secret-files.txt >&2
            echo 'Signing/private-key artifact is tracked.' >&2
            exit 1
          fi
      - name: Scan tracked text for high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'AIza[0-9A-Za-z_-]{30,}|ghp_[0-9A-Za-z]{30,}|github_pat_[0-9A-Za-z_]{50,}|sk-ant-[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- .; then
            echo 'Potential secret detected in tracked files.' >&2
            exit 1
          fi
          if git grep -nE '"(refresh_token|client_secret|private_key)"[[:space:]]*:[[:space:]]*"[^"]{12,}"' -- '*.json'; then
            echo 'Potential OAuth/service-account secret detected in tracked JSON.' >&2
            exit 1
          fi
