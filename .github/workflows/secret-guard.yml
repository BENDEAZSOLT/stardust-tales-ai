name: Secret Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reject tracked credential files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(.env .env.local .env.production service-account.json credentials.json)
          for file in "${forbidden[@]}"; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              echo "Forbidden credential file is tracked: $file" >&2
              exit 1
            fi
          done
      - name: Scan tracked text for high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          git grep -nE 'AIza[0-9A-Za-z_-]{30,}|ghp_[0-9A-Za-z]{30,}|github_pat_[0-9A-Za-z_]{50,}|sk-ant-[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- .             && { echo 'Potential secret detected in tracked files.' >&2; exit 1; }             || true
          git grep -nE '"(refresh_token|client_secret|private_key)"[[:space:]]*:[[:space:]]*"[^"]{12,}"' -- '*.json'             && { echo 'Potential OAuth/service-account secret detected in tracked JSON.' >&2; exit 1; }             || true
