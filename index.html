<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stardust Tales — personalized bedtime stories</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<meta name="theme-color" content="#1b1f3b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Literata:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --sky-deep: #1b1f3b;
    --sky-mid: #2a2f5c;
    --lamp-gold: #f4a94c;
    --lamp-gold-soft: #ffd8a0;
    --page-cream: #fff8ed;
    --ink: #2b2145;
    --ink-soft: #5c5480;
    --mint: #7fd9c4;
    --lavender: #a78bfa;
    --coral: #ff8f7e;
    --shadow: rgba(15,15,40,0.35);
    --book-accent-1: var(--lamp-gold);
    --book-accent-2: var(--coral);
    --book-accent-tint: #f3ead9;
    --book-accent-shadow: rgba(244,169,76,0.3);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.08) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 85%, rgba(167,139,250,0.12) 0%, transparent 50%),
      linear-gradient(180deg, var(--sky-deep) 0%, var(--sky-mid) 100%);
    font-family: 'Nunito', sans-serif; color: var(--page-cream);
    display:flex; justify-content:center; padding: 32px 16px 64px; position:relative; overflow-x:hidden;
  }
  .stars{position:fixed; inset:0; pointer-events:none; z-index:0;}
  .stars span{position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; opacity:.5; animation: twinkle 3.5s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;} 50%{opacity:.85;}}
  @media (prefers-reduced-motion: reduce){ .stars span{animation:none;} }
  .stage{ width:100%; max-width:560px; position:relative; z-index:1; }
  .lang-row{ display:flex; justify-content:center; gap:6px; margin-bottom:22px; flex-wrap:wrap; }
  .lang-chip{ padding:6px 12px; border-radius:999px; border:1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); font-family:'Nunito'; font-weight:700; font-size:12px; color: rgba(255,248,237,0.7); cursor:pointer; transition: all .15s; }
  .lang-chip.active{ background: var(--lamp-gold); border-color: var(--lamp-gold); color:#241a10; }
  .lang-chip:hover{ border-color: var(--lamp-gold); }
  .eyebrow{ font-family:'Nunito'; font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:12px; color: var(--lamp-gold-soft); text-align:center; margin-bottom:8px; }
  h1.brand{ font-family:'Baloo 2'; font-weight:800; font-size: clamp(28px,7vw,40px); text-align:center; margin:0 0 6px; color:#fff; text-shadow: 0 2px 18px rgba(244,169,76,0.35); }
  .brand-sub{ text-align:center; color: rgba(255,248,237,0.65); font-size:14px; margin-bottom:32px; }
  .card{ background: var(--page-cream); color: var(--ink); border-radius: 22px; padding: 28px 24px 24px; box-shadow: 0 24px 60px var(--shadow), inset 0 0 0 1px rgba(43,33,69,0.04); position:relative; }
  .card::before{ content:''; position:absolute; left:0; top:18px; bottom:18px; width:6px; background: linear-gradient(180deg, var(--lamp-gold), var(--coral)); border-radius: 0 6px 6px 0; }
  label{ display:block; font-family:'Nunito'; font-weight:700; font-size:13px; color:var(--ink-soft); margin: 16px 0 6px; }
  label:first-of-type{ margin-top:4px; }
  input[type=text], input[type=number], select{ width:100%; padding:12px 14px; border-radius:12px; border:2px solid #ece3d3; background:#fffdf8; font-family:'Nunito'; font-size:15px; color:var(--ink); outline:none; transition: border-color .15s; }
  input:focus, select:focus{ border-color: var(--lamp-gold); }
  .row{ display:flex; gap:12px; }
  .row > div{ flex:1; }
  .chip-group{ display:flex; flex-wrap:wrap; gap:8px; margin-top:2px; }
  .chip{ padding:8px 14px; border-radius:999px; border:2px solid #ece3d3; background:#fffdf8; font-family:'Nunito'; font-weight:700; font-size:13px; cursor:pointer; color:var(--ink-soft); transition: all .15s; }
  .chip.active{ background: var(--ink); border-color:var(--ink); color:#fffdf8; }
  .chip:hover{ border-color: var(--lamp-gold); }
  .photo-row{ display:flex; align-items:center; gap:14px; margin-top:6px; }
  .photo-preview{ width:56px; height:56px; border-radius:50%; background:#ece3d3; display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; border:2px solid #ece3d3; }
  .photo-preview img{ width:100%; height:100%; object-fit:cover; }
  .photo-preview .ph-icon{ font-size:22px; opacity:.5; }
  .photo-upload-btn{ padding:10px 16px; border-radius:12px; border:2px dashed #ece3d3; background:#fffdf8; font-family:'Nunito'; font-weight:700; font-size:13px; color:var(--ink-soft); cursor:pointer; }
  .photo-upload-btn:hover{ border-color: var(--lamp-gold); }
  input[type=file]{ display:none; }
  .field-note{ font-size:11.5px; color: var(--ink-soft); opacity:.75; margin-top:6px; line-height:1.5; }
  .generate-btn{ margin-top:22px; width:100%; padding:15px; border:none; border-radius:14px; background: linear-gradient(135deg, var(--lamp-gold), var(--coral)); color:#241a10; font-family:'Baloo 2'; font-weight:700; font-size:16px; cursor:pointer; box-shadow: 0 10px 24px rgba(244,169,76,0.35); transition: transform .12s; }
  .generate-btn:hover{ transform: translateY(-1px); }
  .generate-btn:disabled{ opacity:.55; cursor:default; transform:none; }
  .hint{ font-size:12px; color:var(--ink-soft); text-align:center; margin-top:10px; line-height:1.5;}
  .loading{ text-align:center; padding: 60px 10px; }
  .loading .lantern{ width:64px; height:64px; margin:0 auto 18px; border-radius:50%; background: radial-gradient(circle, var(--lamp-gold-soft), var(--lamp-gold) 60%, transparent 75%); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(0.9); opacity:.7;} 50%{ transform:scale(1.05); opacity:1;} }
  .loading p{ font-family:'Baloo 2'; font-size:16px; color: var(--lamp-gold-soft); }
  .book{ display:none; }
  .book.active{ display:block; }
  .book-title{ font-family:'Baloo 2'; font-weight:800; font-size: clamp(22px,6vw,30px); text-align:center; color:#fff; margin: 0 0 18px; text-shadow: 0 2px 14px var(--book-accent-shadow); }
  .page-card{ background: var(--page-cream); border-radius: 22px; overflow:hidden; box-shadow: 0 24px 60px var(--shadow); animation: pageIn .35s ease; position:relative; }
  .page-card::before{ content:''; position:absolute; left:0; top:18px; bottom:18px; width:6px; background: linear-gradient(180deg, var(--book-accent-1), var(--book-accent-2)); border-radius: 0 6px 6px 0; z-index:2; }
  @keyframes pageIn{ from{ opacity:0; transform: translateY(8px) scale(.99);} to{opacity:1; transform:none;} }
  .header-bar{ display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--book-accent-tint); border-bottom:1px solid #ece3d3; }
  .header-avatar{ width:40px; height:40px; border-radius:50%; overflow:hidden; background: linear-gradient(135deg,#ffe9d1,#ffd2ad); display:flex; align-items:center; justify-content:center; flex-shrink:0; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.08); }
  .header-avatar img{ width:100%; height:100%; object-fit:cover; }
  .header-avatar .ph-icon{ font-size:18px; }
  .header-name{ font-family:'Baloo 2'; font-weight:700; font-size:13px; color: var(--ink); }
  .illustration{ height: 190px; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .illustration .motif{ font-size: 78px; filter: drop-shadow(0 8px 16px rgba(0,0,0,.18)); }
  .illustration .art-flag{ position:absolute; bottom:10px; right:12px; background: rgba(27,31,59,0.55); color: var(--lamp-gold-soft); font-size:10px; font-family:'Nunito'; font-weight:700; padding: 4px 9px; border-radius: 999px; letter-spacing:.03em; max-width: 78%; text-align:right; }
  .illustration img{ width:100%; height:100%; object-fit:cover; }
  .page-body{ padding: 20px 24px 26px; }
  .page-text{ font-family:'Literata'; font-size:17px; line-height:1.65; color: var(--ink); }
  .page-footer{ display:flex; align-items:center; justify-content:space-between; margin-top:20px; }
  .page-count{ font-family:'Nunito'; font-weight:700; font-size:12px; color: var(--ink-soft); }
  .listen-btn{ display:flex; align-items:center; gap:6px; background: none; border:2px solid #ece3d3; border-radius: 999px; padding: 7px 14px; font-family:'Nunito'; font-weight:700; font-size:12px; color: var(--ink-soft); cursor:pointer; transition: all .15s; }
  .listen-btn.speaking{ border-color: var(--book-accent-1); color:#a06a1c; background:var(--book-accent-tint); }
  .nav-row{ display:flex; gap:12px; margin-top:18px; }
  .nav-btn{ flex:1; padding:13px; border-radius:14px; border:none; font-family:'Baloo 2'; font-weight:700; font-size:14px; cursor:pointer; background: rgba(255,255,255,0.08); color: var(--page-cream); border: 1px solid rgba(255,255,255,0.14); }
  .nav-btn.primary{ background: linear-gradient(135deg, var(--book-accent-1), var(--book-accent-2)); color:#241a10; }
  .nav-btn:disabled{ opacity:.35; cursor:default; }
  .restart-link{ display:block; text-align:center; margin-top:18px; color: rgba(255,248,237,0.55); font-size:13px; cursor:pointer; text-decoration:underline; background:none; border:none; font-family:'Nunito'; }
  .cta-card{ margin-top:16px; background: linear-gradient(135deg, rgba(167,139,250,.16), rgba(255,143,126,.14)); border: 1px solid rgba(255,255,255,0.14); border-radius:18px; padding:18px 20px; text-align:center; }
  .cta-card p{ font-size:13px; color: rgba(255,248,237,0.8); margin:0 0 12px; line-height:1.5; }
  .cta-btn{ background: #fff; color: var(--ink); border:none; border-radius:12px; padding:11px 20px; font-family:'Baloo 2'; font-weight:700; font-size:14px; cursor:pointer; }
  .error-box{ background: rgba(255,143,126,.12); border:1px solid rgba(255,143,126,.4); color:#ffd8d0; padding:12px 14px; border-radius:12px; font-size:13px; margin-top:14px; line-height:1.5; }
  .library{ margin-bottom:18px; }
  .library-label{ font-family:'Nunito'; font-weight:700; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color: rgba(255,248,237,0.45); margin-bottom:8px; padding-left:2px; }
  .library-row{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
  .library-card{ flex: 0 0 auto; width:120px; background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:14px; padding:10px; cursor:pointer; transition: all .15s; }
  .library-card:hover{ border-color: var(--lamp-gold); background: rgba(255,255,255,0.1); }
  .library-card .lib-emoji{ font-size:26px; margin-bottom:4px; }
  .library-card .lib-title{ font-family:'Nunito'; font-weight:700; font-size:11.5px; color: var(--page-cream); line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* ---- PLANS ---- */
  .plans-label{ font-family:'Nunito'; font-weight:700; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color: rgba(255,248,237,0.45); margin-bottom:8px; padding-left:2px; }
  .plans-row{ display:grid; grid-template-columns: repeat(2,1fr); gap:10px; margin-bottom:20px; }
  .plan-card{ background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); border-radius:16px; padding:14px; }
  .plan-card.current{ border-color: var(--lamp-gold); background: rgba(244,169,76,0.12); }
  .plan-name{ font-family:'Baloo 2'; font-weight:700; font-size:14px; color:#fff; margin-bottom:2px; }
  .plan-price{ font-family:'Nunito'; font-weight:800; font-size:15px; color: var(--lamp-gold-soft); margin-bottom:6px; }
  .plan-price span{ font-size:11px; font-weight:600; color: rgba(255,248,237,0.55); }
  .plan-desc{ font-family:'Nunito'; font-size:11px; color: rgba(255,248,237,0.65); line-height:1.4; margin-bottom:10px; min-height:44px; }
  .plan-btn{ width:100%; padding:8px; border-radius:10px; border:1px solid rgba(255,255,255,0.2); background:transparent; color: var(--page-cream); font-family:'Nunito'; font-weight:700; font-size:11.5px; cursor:pointer; }
  .plan-btn.badge{ background: var(--lamp-gold); border-color: var(--lamp-gold); color:#241a10; cursor:default; }
  .quota-bar{ display:flex; align-items:center; justify-content:space-between; background:#f3ead9; border-radius:12px; padding:10px 14px; margin-top:14px; font-family:'Nunito'; font-size:12px; font-weight:700; color: var(--ink-soft); }
  .upgrade-card{ background: rgba(255,143,126,.14); border:1px solid rgba(255,143,126,.4); border-radius:16px; padding:16px 18px; text-align:center; margin-top:14px; }
  .upgrade-card h4{ font-family:'Baloo 2'; color:#fff; margin:0 0 6px; font-size:15px; }
  .upgrade-card p{ font-family:'Nunito'; font-size:12.5px; color: rgba(255,248,237,0.75); margin:0 0 12px; }
  .compile-btn{ display:block; width:100%; margin-top:10px; padding:11px; border-radius:12px; border:1px dashed rgba(255,255,255,0.3); background: rgba(167,139,250,0.12); color: var(--page-cream); font-family:'Baloo 2'; font-weight:700; font-size:13px; cursor:pointer; }
  .divider-page{ padding: 70px 24px; text-align:center; }
  .divider-page .div-emoji{ font-size:44px; margin-bottom:14px; }
  .divider-page .div-title{ font-family:'Baloo 2'; font-weight:800; font-size:20px; color: var(--ink); }

  /* ---- COMPILE SETUP ---- */
  .story-check-item{ display:flex; align-items:center; gap:10px; padding:10px 12px; border:2px solid #ece3d3; border-radius:12px; margin-bottom:8px; cursor:pointer; background:#fffdf8; }
  .story-check-item input{ width:18px; height:18px; accent-color: var(--lamp-gold); flex-shrink:0; }
  .story-check-item span{ font-family:'Nunito'; font-weight:700; font-size:13px; color:var(--ink); }
  .extra-photo-thumb{ position:relative; flex:0 0 auto; width:64px; height:64px; border-radius:12px; overflow:hidden; border:2px solid #ece3d3; }
  .extra-photo-thumb img{ width:100%; height:100%; object-fit:cover; }
  .extra-photo-thumb button{ position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; border:none; background:rgba(43,33,69,0.75); color:#fff; font-size:11px; line-height:1; cursor:pointer; }

  /* ---- PRINT ---- */
  #printArea{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ display:block; position:absolute; left:0; top:0; width:100%; }
    #printArea .print-page{ page-break-after:always; padding:40px; }
    #printArea img{ max-width:100%; border-radius:12px; margin-bottom:16px; }
    #printArea h2{ font-family:'Baloo 2', sans-serif; }
    #printArea p{ font-family:'Literata', serif; font-size:16px; line-height:1.7; }
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="stage">
  <div class="lang-row" id="langRow"></div>
  <div class="eyebrow" id="brandEyebrow"></div>
  <h1 class="brand" id="brandTitle"></h1>
  <p class="brand-sub" id="brandSub"></p>

  <div class="plans-label" id="plansLabel"></div>
  <div class="plans-row" id="plansRow"></div>

  <div class="library" id="libraryBox" style="display:none;">
    <div class="library-label" id="libraryLabel"></div>
    <div class="library-row" id="libraryRow"></div>
    <button class="compile-btn" id="compileBtn" style="display:none;" onclick="openCompileSetup()"></button>
  </div>

  <div class="card" id="formCard">
    <div style="display:flex; align-items:flex-start; gap:10px; background:#fff3cd; border:1px solid #ffe69c; border-radius:12px; padding:12px 14px; margin-bottom:16px;">
      <input type="checkbox" id="parentConsent" style="margin-top:3px; width:18px; height:18px; flex-shrink:0;">
      <label for="parentConsent" id="lblConsent" style="font-family:'Nunito'; font-size:13px; color:#5b4b1e; line-height:1.4; cursor:pointer;"></label>
    </div>

    <label id="lblName" for="childName"></label>
    <input type="text" id="childName" maxlength="24">

    <div class="row">
      <div>
        <label id="lblAge" for="childAge"></label>
        <input type="number" id="childAge" min="2" max="13" value="6">
      </div>
      <div>
        <label id="lblColor" for="favColor"></label>
        <select id="favColor"></select>
      </div>
    </div>

    <label id="lblPhoto"></label>
    <div class="photo-row">
      <div class="photo-preview" id="photoPreview"><span class="ph-icon">🧒</span></div>
      <label class="photo-upload-btn" id="photoUploadBtn" for="childPhoto" style="touch-action:manipulation;"></label>
      <input type="file" id="childPhoto" accept="image/*" style="display:none">
    </div>
    <div class="field-note" id="photoHint"></div>

    <label id="lblWorld"></label>
    <div class="chip-group" id="worldChips"></div>

    <label id="lblTheme"></label>
    <div class="chip-group" id="themeChips"></div>

    <label id="lblPageCount" for="pageCount"></label>
    <input type="number" id="pageCount" min="4" max="30" value="10">
    <div class="field-note" id="pageCountHint"></div>

    <button class="generate-btn" id="generateBtn" onclick="generateStory()"></button>
    <div class="hint" id="hintText"></div>
    <div class="quota-bar" id="quotaBar" style="display:none;">
      <span id="quotaText"></span>
    </div>
    <div class="upgrade-card" id="upgradeCard" style="display:none;">
      <h4 id="upgradeTitle"></h4>
      <p id="upgradeMsg"></p>
    </div>
    <div id="errorBox"></div>
  </div>

  <div class="loading" id="loadingBox" style="display:none;">
    <div class="lantern"></div>
    <p id="loadingText"></p>
  </div>

  <div class="card" id="compileSetupView" style="display:none;">
    <label id="compileSetupTitle" style="font-family:'Baloo 2'; font-weight:700; font-size:16px; color:var(--ink); margin-top:0;"></label>
    <div id="compileStoryList" style="margin-top:6px;"></div>

    <label id="compileExtraPhotosLabel"></label>
    <div class="photo-row">
      <label class="photo-upload-btn" id="compileExtraPhotosBtn" for="compileExtraPhotosInput" style="touch-action:manipulation;"></label>
      <input type="file" id="compileExtraPhotosInput" accept="image/*" multiple style="display:none">
    </div>
    <div class="library-row" id="compileExtraPhotosPreview" style="margin-top:10px;"></div>

    <button class="generate-btn" id="compileConfirmBtn" onclick="confirmCompile()"></button>
    <button class="restart-link" id="compileCancelBtn" onclick="closeCompileSetup()" style="color:var(--ink-soft);"></button>
    <div id="compileErrorBox"></div>
  </div>

  <div class="book" id="bookView">
    <div class="book-title" id="bookTitle"></div>
    <div class="page-card">
      <div class="header-bar">
        <div class="header-avatar" id="headerAvatar"><span class="ph-icon">✨</span></div>
        <div class="header-name" id="headerName"></div>
      </div>
      <div class="illustration" id="illustration">
        <div class="motif" id="motif">🌲</div>
        <div class="art-flag" id="artFlag"></div>
      </div>
      <div class="page-body">
        <div class="page-text" id="pageText"></div>
        <div class="page-footer">
          <div class="page-count" id="pageCountDisplay"></div>
          <button class="listen-btn" id="listenBtn" onclick="toggleListen()"></button>
        </div>
      </div>
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prevBtn" onclick="prevPage()"></button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextPage()"></button>
    </div>
    <div class="nav-row" id="bookActions" style="display:none;">
      <button class="nav-btn" id="downloadBtn" onclick="downloadStorybookPDF()"></button>
      <button class="nav-btn" id="printBtn" onclick="printStorybook()"></button>
    </div>
    <div class="cta-card" id="ctaCard" style="display:none;">
      <p id="ctaText"></p>
      <button class="cta-btn" id="ctaBtn" onclick="onCtaClick()"></button>
    </div>
    <button class="restart-link" id="restartLink" onclick="resetApp()"></button>
  </div>
</div>
<div id="printArea"></div>
<div style="text-align:center; padding:18px 20px 30px; font-family:'Nunito',sans-serif; font-size:12px; color:#a89fc4;">
  <a href="/privacy.html" style="color:#a89fc4;">Privacy Policy</a> &nbsp;·&nbsp; <a href="/terms.html" style="color:#a89fc4;">Terms of Use</a>
</div>

<script>
/* ================= THEME / WORLD DATA (language-independent keys) ================= */
const WORLD_BANDS = {
  toddler: ['friendly_animals','brave_kitten','little_car','bedtime_garden'],
  early:   ['magic_forest','ocean_deep','dino_island','superhero_school','fairy_garden','animal_rescue'],
  middle:  ['blocky_builder','space_explorers','detective_mystery','robot_inventors','pirate_treasure','sports_champion','magic_school'],
  tween:   ['blocky_survivors','future_racers','secret_mission','legend_hunters','music_dance','esports_arena']
};
function getAgeBand(age){
  age = parseInt(age,10) || 6;
  if(age <= 4) return 'toddler';
  if(age <= 7) return 'early';
  if(age <= 10) return 'middle';
  return 'tween';
}
const BAND_DEFAULT_PAGES = { toddler:6, early:10, middle:18, tween:26 };
const BAND_READING_LEVEL = {

/* =========================================================
   ILLUSTRATION PROVIDER — the child's photo is turned into a stylized
   storybook character entirely on-device, with a Canvas image filter
   (edge-detection outlines + color posterization + saturation boost).
   No network call, no API key, no per-image cost — runs for free,
   forever, for every user, online or offline.
   ========================================================= */
function clamp255(v){ return v<0?0:(v>255?255:v); }
function boxBlur3(data, w, h){
  const out = new Uint8ClampedArray(data.length);
  for(let y=0; y<h; y++){
    for(let x=0; x<w; x++){
      let r=0,g=0,b=0,a=0,n=0;
      for(let dy=-1; dy<=1; dy++){
        const yy = y+dy; if(yy<0||yy>=h) continue;
        for(let dx=-1; dx<=1; dx++){
          const xx = x+dx; if(xx<0||xx>=w) continue;
          const i = (yy*w+xx)*4;
          r+=data[i]; g+=data[i+1]; b+=data[i+2]; a+=data[i+3]; n++;
        }
      }
      const o = (y*w+x)*4;
      out[o]=r/n; out[o+1]=g/n; out[o+2]=b/n; out[o+3]=a/n;
    }
  }
  return out;
}
function cartoonifyImage(imageDataUrl){
  return new Promise((resolve)=>{
    try{
      const img = new Image();
      img.onload = function(){
        try{
          const maxDim = 640;
          let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          if(w > maxDim || h > maxDim){
            if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const src = ctx.getImageData(0, 0, w, h);

          const gray = new Uint8ClampedArray(w*h);
          for(let i=0, p=0; i<src.data.length; i+=4, p++){
            gray[p] = (src.data[i]*0.299 + src.data[i+1]*0.587 + src.data[i+2]*0.114) | 0;
          }
          const edge = new Uint8ClampedArray(w*h);
          const gx = [-1,0,1,-2,0,2,-1,0,1], gy = [-1,-2,-1,0,0,0,1,2,1];
          for(let y=1; y<h-1; y++){
            for(let x=1; x<w-1; x++){
              let sx=0, sy=0, k=0;
              for(let dy=-1; dy<=1; dy++){
                for(let dx=-1; dx<=1; dx++){
                  const v = gray[(y+dy)*w + (x+dx)];
                  sx += v*gx[k]; sy += v*gy[k]; k++;
                }
              }
              const mag = Math.sqrt(sx*sx + sy*sy);
              edge[y*w+x] = mag > 90 ? 255 : 0;
            }
          }

          let data = new Uint8ClampedArray(src.data);
          data = boxBlur3(data, w, h);
          data = boxBlur3(data, w, h);

          const levels = 6;
          const step = 255/(levels-1);
          for(let i=0; i<data.length; i+=4){
            let r = data[i], g = data[i+1], b = data[i+2];
            const lum = 0.299*r + 0.587*g + 0.114*b;
            const sat = 1.3;
            r = clamp255(lum + (r-lum)*sat);
            g = clamp255(lum + (g-lum)*sat);
            b = clamp255(lum + (b-lum)*sat);
            data[i]   = Math.round(Math.round(r/step)*step);
            data[i+1] = Math.round(Math.round(g/step)*step);
            data[i+2] = Math.round(Math.round(b/step)*step);
          }

          for(let p=0; p<edge.length; p++){
            if(edge[p]){
              const i = p*4;
              data[i] = 30; data[i+1] = 30; data[i+2] = 35;
            }
          }

          const out = new ImageData(data, w, h);
          ctx.putImageData(out, 0, 0);
          resolve(canvas.toDataURL('image/jpeg', 0.9));
        }catch(e){ resolve(imageDataUrl); }
      };
      img.onerror = function(){ resolve(imageDataUrl); };
      img.src = imageDataUrl;
    }catch(e){ resolve(imageDataUrl); }
  });
}
async function generateCharacterPortrait(photoDataUrl, ageBand){
  if(!photoDataUrl) return null;
  try{ return await cartoonifyImage(photoDataUrl); }catch(e){ return null; }
}
function hexPairFromGradient(gradStr){
  const m = (gradStr||'').match(/#([0-9a-fA-F]{3,6})/g) || ['#ffffff','#eeeeee'];
  return [m[0] || '#ffffff', m[1] || m[0] || '#eeeeee'];
}
/* Per-page illustration dispatcher: paid plans get a real AI-generated scene
   (see ILLUSTRATION_API above), free plans get the zero-cost Canvas
   composite (generateIllustrationCanvas below). Every page shows the child's
   own storybook character in a scene tied to that page's part of the story
   either way — the paid version just keeps the child's actual face. */
async function generateIllustration(page){
  // Paid tier: try the real AI scene first — keeps the child's actual face,
  // depicting this specific page's moment in the story. Any failure (no
  // endpoint yet, no FAL_KEY configured, network error, quota) falls back to
  // the free Canvas composite further down, so the app never breaks.
  if(currentPlan !== 'free' && ILLUSTRATION_API.endpoint && childPhotoDataUrl){
    try{
      const res = await fetch(ILLUSTRATION_API.endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          childPhotoDataUrl,
          pageText: page.text || '',
          motif: page.motif || 'star'
        })
      });
      if(res.ok){
        const data = await res.json();
        if(data && data.imageUrl) return data.imageUrl;
      } else {
        console.warn('AI illustration request failed with status', res.status, '— using free composite instead.');
      }
    }catch(e){
      console.warn('AI illustration unavailable, using free composite instead:', e);
    }
  }
  return generateIllustrationCanvas(page);
}

/* Free-tier illustration: composites the child's own stylized cartoon
   portrait (generated once, see generateCharacterPortrait) as the storybook
   character standing inside a themed backdrop that matches THAT page's
   motif keyword. Entirely via Canvas — no network call, no API key, no
   per-image cost. Also the fallback path for the paid tier above. */
async function generateIllustrationCanvas(page){
  try{
    const w = 640, h = 400;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    const m = MOTIFS[page.motif] || MOTIFS.star;
    const [c1, c2] = hexPairFromGradient(m.grad);
    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, c1);
    grad.addColorStop(1, c2);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.font = '220px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(m.emoji || '⭐', w * 0.75, h * 0.4);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(w * 0.32, h * 0.86, 95, 20, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if(headerAvatarUrl){
      const charImg = await new Promise((resolve) => {
        const im = new Image();
        im.onload = () => resolve(im);
        im.onerror = () => resolve(null);
        im.src = headerAvatarUrl;
      });
      if(charImg){
        const targetH = h * 0.72;
        const targetW = targetH * (charImg.width / charImg.height);
        const cx = w * 0.32 - targetW / 2;
        const cy = h - targetH - h * 0.06;
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.25)';
        ctx.shadowBlur = 14;
        ctx.shadowOffsetY = 6;
        ctx.drawImage(charImg, cx, cy, targetW, targetH);
        ctx.restore();
      }
    }
    return canvas.toDataURL('image/jpeg', 0.85);
  }catch(e){ return null; }
}

/* =========================================================

   IMPORTANT ARCHITECTURE NOTE: the quota counter below
   (storiesUsedInPeriod) lives only in this page's memory, purely to
   demonstrate the gating logic. A real paid product MUST enforce quotas
   server-side (e.g. a small backend function checking RevenueCat
   entitlements + a database counter), because any client-side-only

async function purchasePlan(planId){
  if(planId === 'free'){ currentPlan = 'free'; storiesUsedInPeriod = 0; saveDemoPlanState(); renderPlans(); return true; }
  const hasNativeBridge = window.NativePurchase && ("getDigitalGoodsService" in window);
  let success = false;
  if(hasNativeBridge){
    // Real Android purchase attempt. FIX (2026-09-05): this used to fall through
    // to the demo assignment below unconditionally, so a cancelled or failed
    // real purchase still granted the plan for free. Only apply it on success now.
    success = await window.NativePurchase.purchasePlan(planId, PLANS[planId].price);
    if(success){ currentPlan = planId; storiesUsedInPeriod = 0; }
  } else {
    // Demo/testing fallback: no native purchase bridge exists outside the
    // installed Android app, so switch the plan locally for testing the quota
    // gating and storybook compilation feature. Persisted via
    // saveDemoPlanState() below so it survives a reload — see that function's
    // comment. This branch never runs when a real bridge is present.
    alert(I18N[currentLang].ctaAlert);
    currentPlan = planId;
    storiesUsedInPeriod = 0;
    success = true;
  }
  saveDemoPlanState();
  renderPlans();
  return success;
}

  document.getElementById('ctaText').textContent = t.ctaText;
  document.getElementById('ctaBtn').textContent = t.ctaBtn;
  document.getElementById('restartLink').textContent = t.restartLink;
  document.getElementById('compileSetupTitle').textContent = t.compileSetupTitle;
  document.getElementById('compileExtraPhotosLabel').textContent = t.compileExtraPhotosLabel;
  document.getElementById('compileExtraPhotosBtn').textContent = t.compileExtraPhotosBtn;
  document.getElementById('compileConfirmBtn').textContent = t.compileConfirmBtn;
  document.getElementById('compileCancelBtn').textContent = t.compileCancelBtn;
  document.getElementById('downloadBtn').textContent = t.downloadBtn;
  document.getElementById('printBtn').textContent = t.printBtn;

  if(storyPages.length){ renderPage(); } else {
    document.getElementById('nextBtn').textContent = t.nextBtn;
  }
  renderLibrary();
  renderPlans();
}

document.getElementById('childAge').addEventListener('change', onAgeChange);
document.getElementById('childPhoto').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    childPhotoDataUrl = ev.target.result;
    document.getElementById('photoPreview').innerHTML = '<img src="'+childPhotoDataUrl+'" alt="">';
  };
  reader.readAsDataURL(file);
});

async function generateStory(){
  const t = I18N[currentLang];
  if(!document.getElementById('parentConsent').checked){ showError(t.errorNoConsent); return; }
  const name = document.getElementById('childName').value.trim();
  if(!name){ showError(t.errorNoName); return; }
  if(remainingQuota() <= 0){ updateQuotaUI(); return; }
  const age = document.getElementById('childAge').value || 6;
  const band = getAgeBand(age);
  const color = document.getElementById('favColor').value;
  const colorKey = COLOR_KEYS[document.getElementById('favColor').selectedIndex] || 'blue';
  const worldKey = getActive('worldChips');
  const themeKey = getActive('themeChips');
  let pageCount = parseInt(document.getElementById('pageCount').value,10) || BAND_DEFAULT_PAGES[band];
  pageCount = Math.max(4, Math.min(30, pageCount));

  const worldLabel = THEME_LABELS[currentLang][worldKey].replace(/^[^\w]*\s/, '');
  const themeLabel = (t.themes.find(s=>s[0]===themeKey) || t.themes[0])[1].replace(/^[^\w]*\s/, '');
  const readingLevel = BAND_READING_LEVEL[band];

  document.getElementById('formCard').style.display = 'none';
  document.getElementById('loadingBox').style.display = 'block';
  let li = 0;
  document.getElementById('loadingText').textContent = t.loadingLines[0];
  const loadingInterval = setInterval(()=>{ li=(li+1)%t.loadingLines.length; document.getElementById('loadingText').textContent = t.loadingLines[li]; }, 2200);

  const systemPrompt = `You are a children's book author. Return ONLY a JSON object, nothing else — no explanation, no markdown code fence.
The JSON must look exactly like this:
{"title": "story title", "pages": [{"text": "1 short paragraph", "motif": "forest|sky|ocean|castle|home|star|friend|animal|car|garden|dino|hero|fairy|blocks|space|mystery|robot|pirate|race|mission|legend|rescue|trophy|wand|music|arena"}]}
Return an array of exactly ${pageCount} "pages". Reading level: ${readingLevel}. Write everything in ${t.promptLang}. The story must be coherent across all ${pageCount} pages: a beginning (introduction), a middle (the challenge/obstacle, can unfold over several pages for longer stories), and an end (resolution, gentle takeaway). For "motif", always choose the keyword that best matches that page's main visual scene. The story has no other named recurring character besides ${name} — ${name} carries the adventure on their own, no sidekick character should be introduced.`;

  const userPrompt = `Write a ${pageCount}-page personalized bedtime/adventure story appropriate for a ${age}-year-old.
Main character: ${name}, age ${age}.
Favorite color: ${color}.
World / setting genre: ${worldLabel}.
Underlying theme: ${themeLabel}.
The tone should be safe and age-appropriate, ending with ${name} feeling confident and happy. Write the whole response in ${t.promptLang}.`;

  try{
    const maxTokens = Math.min(4000, 250*pageCount+300);
    let data;
    if(STORY_API.endpoint){
      // Production path: your own backend holds the real Anthropic key.
      const response = await fetch(STORY_API.endpoint, {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ system: systemPrompt, prompt: userPrompt, maxTokens })
      });
      data = await response.json();
      if(!response.ok) throw new Error(data.error || ('Backend error '+response.status));
    } else {
      // Preview-only fallback: this direct call only works inside Claude's own
      // artifact preview, which auto-authenticates it. It will fail with a 401
      // in a standalone browser tab or the native app — set STORY_API.endpoint
      // above to your deployed /api/generate-story function before shipping.
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens: maxTokens, system: systemPrompt, messages:[{role:"user", content:userPrompt}] })
      });
      data = await response.json();
      if(!response.ok) throw new Error((data.error && data.error.message) || ('API error '+response.status));
    }
    const raw = (data.content||[]).map(b=>b.text||'').join('').trim();
    const cleaned = raw.replace(/^```json/,'').replace(/^```/,'').replace(/```$/,'').trim();
    const parsed = JSON.parse(cleaned);

    storyPages = parsed.pages || [];
    const title = parsed.title || (name + (currentLang==='hu' ? ' meséje' : "'s Story"));
    document.getElementById('bookTitle').textContent = title;
    document.getElementById('headerName').textContent = name;
    applyBookColorTheme(colorKey);

    headerAvatarUrl = profileAvatars[name] || await generateCharacterPortrait(childPhotoDataUrl, band);
    if(headerAvatarUrl) profileAvatars[name] = headerAvatarUrl;
    const avatarEl = document.getElementById('headerAvatar');
    avatarEl.innerHTML = headerAvatarUrl ? '<img src="'+headerAvatarUrl+'" alt="">' : '<span class="ph-icon">✨</span>';

    storiesUsedInPeriod++;
    updateQuotaUI();

    clearInterval(loadingInterval);
    document.getElementById('loadingBox').style.display = 'none';
    isCompiledBook = false;
    document.getElementById('bookActions').style.display = 'none';
    document.getElementById('bookView').classList.add('active');
    currentPage = 0;
    renderPage();

    const storyId = 'story-' + Date.now();
    libraryStories.push({ id: storyId, title, name, lang: currentLang, pages: storyPages, avatarUrl: headerAvatarUrl, colorKey });
    renderLibrary();

    storyPages.forEach(async (page, idx)=>{
      const url = await generateIllustration(page);
      if(url){ page.imageUrl = url; if(currentPage === idx) renderPage(); }
    });
  }catch(err){
    clearInterval(loadingInterval);
    document.getElementById('loadingBox').style.display = 'none';
    document.getElementById('formCard').style.display = 'block';
    showError(t.errorGeneric + err.message + ')');
  }
}

function showError(msg){ document.getElementById('errorBox').innerHTML = '<div class="error-box">' + msg + '</div>'; }

function renderPage(){
  const t = I18N[currentLang];
  const page = storyPages[currentPage];
  document.getElementById('pageCountDisplay').textContent = (currentPage+1) + ' / ' + storyPages.length;
  const illoEl = document.getElementById('illustration');
  const listenBtn = document.getElementById('listenBtn');

  if(page.divider){
    illoEl.style.background = 'none';
    illoEl.innerHTML = '';
    document.getElementById('pageText').innerHTML = '<div class="divider-page"><div class="div-emoji">'+(page.emoji||'📖')+'</div><div class="div-title">'+page.title+'</div></div>';
    listenBtn.style.visibility = 'hidden';
  } else if(page.photoPage){
    illoEl.style.background = 'none';
    illoEl.innerHTML = page.imageUrl ? '<img src="'+page.imageUrl+'" alt="">' : '';
    document.getElementById('pageText').textContent = '';
    listenBtn.style.visibility = 'hidden';
  } else {
    document.getElementById('pageText').textContent = page.text;
    listenBtn.style.visibility = 'visible';
    const m = MOTIFS[page.motif] || MOTIFS.star;
    if(page.imageUrl){
      illoEl.style.background = 'none';
      illoEl.innerHTML = '<img src="'+page.imageUrl+'" alt=""><div class="art-flag" id="artFlag"></div>';
    } else {
      illoEl.style.background = m.grad;
      illoEl.innerHTML = '<div class="motif" id="motif">'+m.emoji+'</div><div class="art-flag" id="artFlag"></div>';
    }
    document.getElementById('artFlag').textContent = t.artFlag;
  }
  document.getElementById('prevBtn').disabled = currentPage === 0;
  document.getElementById('nextBtn').textContent = currentPage === storyPages.length-1 ? t.nextBtnEnd : t.nextBtn;
  document.getElementById('ctaCard').style.display = (currentPage === storyPages.length-1 && !isCompiledBook) ? 'block' : 'none';
  stopListening();
}

function openCompileSetup(){
  extraPhotos = [];
  document.getElementById('formCard').style.display = 'none';
  document.getElementById('plansLabel').style.display = 'none';
  document.getElementById('plansRow').style.display = 'none';
  document.getElementById('libraryBox').style.display = 'none';
  document.getElementById('compileSetupView').style.display = 'block';
  renderCompileStoryList();
  renderExtraPhotosPreview();
}

function closeCompileSetup(){
  document.getElementById('compileSetupView').style.display = 'none';
  document.getElementById('plansLabel').style.display = '';
  document.getElementById('plansRow').style.display = '';
  document.getElementById('formCard').style.display = 'block';
  renderLibrary();
}

function renderCompileStoryList(){
  const list = document.getElementById('compileStoryList');
  list.innerHTML = '';
  libraryStories.slice().reverse().forEach(story=>{
    const item = document.createElement('label');
    item.className = 'story-check-item';
    item.innerHTML = '<input type="checkbox" data-id="'+story.id+'" checked><span>'+story.title+'</span>';
    list.appendChild(item);
  });
}

document.getElementById('compileExtraPhotosInput').addEventListener('change', function(e){
  const files = Array.from(e.target.files || []);
  let remaining = files.length;
  if(!remaining) return;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = ev=>{ extraPhotos.push(ev.target.result); renderExtraPhotosPreview(); };
    reader.readAsDataURL(file);
  });
  e.target.value = ''; // allow re-selecting the same file(s) again later
});

function renderExtraPhotosPreview(){
  const row = document.getElementById('compileExtraPhotosPreview');
  row.innerHTML = '';
  extraPhotos.forEach((url, idx)=>{
    const thumb = document.createElement('div');
    thumb.className = 'extra-photo-thumb';
    thumb.innerHTML = '<img src="'+url+'" alt=""><button type="button" onclick="removeExtraPhoto('+idx+')">✕</button>';
    row.appendChild(thumb);
  });
}
function removeExtraPhoto(idx){ extraPhotos.splice(idx,1); renderExtraPhotosPreview(); }

function confirmCompile(){
  const t = I18N[currentLang];
  const checked = Array.from(document.querySelectorAll('#compileStoryList input:checked')).map(el=>el.dataset.id);
  const selected = libraryStories.filter(s=> checked.includes(s.id)); // keeps original chronological order
  if(!selected.length){
    document.getElementById('compileErrorBox').innerHTML = '<div class="error-box">'+t.noStorySelectedError+'</div>';
    return;
  }
  document.getElementById('compileErrorBox').innerHTML = '';

  const combined = [];
  selected.forEach(story=>{
    combined.push({ divider:true, title: story.title, emoji: MOTIFS[(story.pages[0]||{}).motif]?.emoji || '📖' });
    story.pages.forEach(p=> combined.push(p));
  });
  extraPhotos.forEach(url=> combined.push({ photoPage:true, imageUrl:url }));
  storyPages = combined;

  // Use the most recently created selected story's color/child, not always the oldest one —
  // this is what was causing the compiled book's color to look "stuck" regardless of the
  // favorite color picked on newer stories.
  const mostRecent = selected[selected.length-1];
  headerAvatarUrl = profileAvatars[mostRecent.name] || mostRecent.avatarUrl;
  applyBookColorTheme(mostRecent.colorKey || 'blue');

  document.getElementById('bookTitle').textContent = mostRecent.name + t.compileTitleSuffix;
  document.getElementById('headerName').textContent = mostRecent.name;
  document.getElementById('headerAvatar').innerHTML = headerAvatarUrl ? '<img src="'+headerAvatarUrl+'" alt="">' : '<span class="ph-icon">✨</span>';

  isCompiledBook = true;
  document.getElementById('bookActions').style.display = 'flex';
  document.getElementById('compileSetupView').style.display = 'none';
  document.getElementById('bookView').classList.add('active');
  currentPage = 0;
  renderPage();
}

function downloadStorybookPDF(){
  if(!window.jspdf){ alert('PDF library failed to load — check your internet connection and try again.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a5' });
  const pageW = doc.internal.pageSize.getWidth();
  const margin = 40;
  let first = true;
  storyPages.forEach(page=>{
    if(!first) doc.addPage(); first = false;
    let y = margin + 20;
    doc.setFont('helvetica','bold'); doc.setFontSize(18);
    if(page.divider){
      doc.text(page.title, pageW/2, pageW*0.35, { align:'center', maxWidth: pageW-2*margin });
      return;
    }
    if(page.photoPage && page.imageUrl){
      try{ doc.addImage(page.imageUrl, 'JPEG', margin, y, pageW-2*margin, pageW-2*margin); }catch(e){ console.warn('Could not embed photo in PDF:', e); }
      return;
    }
    if(page.imageUrl){
      try{ doc.addImage(page.imageUrl, 'JPEG', margin, y, pageW-2*margin, (pageW-2*margin)*0.6); y += (pageW-2*margin)*0.6 + 20; }catch(e){ console.warn('Could not embed illustration in PDF:', e); }
    }
    doc.setFont('helvetica','normal'); doc.setFontSize(13);
    doc.text(page.text || '', margin, y, { maxWidth: pageW-2*margin, lineHeightFactor:1.5 });
  });
  doc.save((document.getElementById('bookTitle').textContent || 'storybook') + '.pdf');
}

function printStorybook(){
  const area = document.getElementById('printArea');
  area.innerHTML = storyPages.map(page=>{
    if(page.divider) return '<div class="print-page"><h2>'+page.title+'</h2></div>';
    if(page.photoPage) return '<div class="print-page">'+(page.imageUrl?'<img src="'+page.imageUrl+'">':'')+'</div>';
    return '<div class="print-page">'+(page.imageUrl?'<img src="'+page.imageUrl+'">':'')+'<p>'+(page.text||'')+'</p></div>';
  }).join('');
  window.print();
}


function renderPlans(){
  const t = I18N[currentLang];
  document.getElementById('plansLabel').textContent = t.plansTitle;
  const row = document.getElementById('plansRow');
  row.innerHTML = '';
  PLAN_ORDER.forEach(id=>{
    const plan = PLANS[id];
    const card = document.createElement('div');
    card.className = 'plan-card' + (id===currentPlan ? ' current' : '');
    const priceHtml = plan.price === 0
      ? t.freePriceLabel
      : '$'+plan.price.toFixed(2)+'<span>'+(plan.billingPeriod==='week'?t.perWeek:t.perMonth)+'</span>';
    const btnHtml = id===currentPlan
      ? '<button class="plan-btn badge">'+t.currentPlanBadge+'</button>'
      : '<button class="plan-btn" onclick="purchasePlan(\''+id+'\')">'+t.selectPlanBtn+'</button>';
    card.innerHTML =
      '<div class="plan-name">'+t['planName_'+id]+'</div>'+
      '<div class="plan-price">'+priceHtml+'</div>'+
      '<div class="plan-desc">'+t['planDesc_'+id]+'</div>'+
      btnHtml;
    row.appendChild(card);
  });
  // One-time storybook add-on — separate purchase, not a plan swap.
  const addonCard = document.createElement('div');
  addonCard.className = 'plan-card' + (hasStorybookAddon ? ' current' : '');
  const addonBtnHtml = hasStorybookAddon
    ? '<button class="plan-btn badge">'+t.addonOwnedBadge+'</button>'
    : '<button class="plan-btn" onclick="purchaseAddon()">'+t.selectPlanBtn+'</button>';
  addonCard.innerHTML =
    '<div class="plan-name">'+t.planName_compile+'</div>'+
    '<div class="plan-price">$'+STORYBOOK_ADDON.price.toFixed(2)+'<span>'+t.oneTimeLabel+'</span></div>'+
    '<div class="plan-desc">'+t.planDesc_compile+'</div>'+
    addonBtnHtml;
  row.appendChild(addonCard);
  updateQuotaUI();
}

function updateQuotaUI(){
  const t = I18N[currentLang];
  const quota = PLANS[currentPlan].quota;
  const used = storiesUsedInPeriod;
  const quotaBar = document.getElementById('quotaBar');
  const upgradeCard = document.getElementById('upgradeCard');
  const genBtn = document.getElementById('generateBtn');
  if(used >= quota){
    quotaBar.style.display = 'none';
    upgradeCard.style.display = 'block';
    document.getElementById('upgradeTitle').textContent = t.quotaExceededTitle;
    document.getElementById('upgradeMsg').textContent = t.quotaExceededMsg;
    genBtn.disabled = true;
  } else {
    upgradeCard.style.display = 'none';
    quotaBar.style.display = 'flex';
    document.getElementById('quotaText').textContent = t.quotaRemaining.replace('{used}', used).replace('{quota}', quota);
    genBtn.disabled = false;
  }
  const compileBtn = document.getElementById('compileBtn');
  if(hasStorybookAddon && libraryStories.length > 0){
    compileBtn.style.display = 'block';
    compileBtn.textContent = t.compileBtn;
  } else {
    compileBtn.style.display = 'none';
  }
}

function renderLibrary(){
  const t = I18N[currentLang];
  const box = document.getElementById('libraryBox'); const row = document.getElementById('libraryRow');
  if(!libraryStories.length){ box.style.display='none'; updateQuotaUI(); return; }
  box.style.display = 'block';
  document.getElementById('libraryLabel').textContent = t.libraryLabel;
  row.innerHTML = '';
  libraryStories.slice().reverse().forEach(story=>{
    const card = document.createElement('div'); card.className = 'library-card';
    const emoji = MOTIFS[(story.pages[0]||{}).motif]?.emoji || '📖';
    card.innerHTML = '<div class="lib-emoji">'+emoji+'</div><div class="lib-title">'+story.title+'</div>';
    card.onclick = ()=>{
      storyPages = story.pages; currentLang = story.lang; headerAvatarUrl = story.avatarUrl;
      applyLanguage();
      applyBookColorTheme(story.colorKey || 'blue');
      isCompiledBook = false;
      document.getElementById('bookActions').style.display = 'none';
      document.getElementById('formCard').style.display = 'none';
      document.getElementById('bookView').classList.add('active');
      document.getElementById('headerName').textContent = story.name;
      document.getElementById('headerAvatar').innerHTML = headerAvatarUrl ? '<img src="'+headerAvatarUrl+'" alt="">' : '<span class="ph-icon">✨</span>';
      currentPage = 0; renderPage();
    };
    row.appendChild(card);
  });
  updateQuotaUI();
}

function nextPage(){ if(currentPage < storyPages.length-1){ currentPage++; renderPage(); } }
function prevPage(){ if(currentPage > 0){ currentPage--; renderPage(); } }

function toggleListen(){
  if(speaking){ stopListening(); return; }
  const page = storyPages[currentPage];
  if(!page || page.divider || page.photoPage) return;
  if(!('speechSynthesis' in window)){ console.warn('speechSynthesis not supported in this environment'); return; }
  const t = I18N[currentLang];
  const utter = new SpeechSynthesisUtterance(page.text);
  utter.lang = t.ttsTag; utter.rate = 0.95;
  const voices = speechSynthesis.getVoices();
  const match = voices.find(v => v.lang === t.ttsTag) || voices.find(v => v.lang && v.lang.startsWith(t.ttsTag.slice(0,2)));
  if(match) utter.voice = match; // falls back to the browser's default voice if none matches — still speaks, just not guaranteed in the right accent
  utter.onend = ()=>{ speaking=false; document.getElementById('listenBtn').classList.remove('speaking'); };
  utter.onerror = (e)=>{ console.error('Speech synthesis error:', e.error); speaking=false; document.getElementById('listenBtn').classList.remove('speaking'); };
  speechSynthesis.cancel(); // clear any stuck queue before speaking — some browsers silently drop new utterances otherwise
  speechSynthesis.speak(utter); speaking = true;
  document.getElementById('listenBtn').classList.add('speaking');
}
// Chrome/Safari load voices asynchronously — call once early so the list is ready by the time someone taps Listen.
if('speechSynthesis' in window){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = ()=> speechSynthesis.getVoices();
}
function stopListening(){ speechSynthesis.cancel(); speaking = false; document.getElementById('listenBtn').classList.remove('speaking'); }

function onCtaClick(){ const current = libraryStories[libraryStories.length-1]; purchaseStory(current ? current.id : 'demo-story'); }

function resetApp(){
  stopListening(); storyPages = [];
  resetBookColorTheme();
  isCompiledBook = false;
  document.getElementById('bookActions').style.display = 'none';
  document.getElementById('bookView').classList.remove('active');
  document.getElementById('formCard').style.display = 'block';
  document.getElementById('errorBox').innerHTML = '';
}

currentLang = detectLang();
applyLanguage();
onAgeChange();
